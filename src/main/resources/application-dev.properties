# ==== Profil dev : base H2 dans un fichier (dossier ./data, ignoré par git) ====
spring.datasource.url=jdbc:h2:file:./data/repetipro;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# Console H2 (http://localhost:8080/h2-console) désactivée par défaut pour rester simple
spring.h2.console.enabled=false
# Le compte démo (01 00 00 00 00) est admin en local
repetipro.admin-telephones=0100000000
# Rechargement des gabarits sans redémarrer
spring.thymeleaf.cache=false
