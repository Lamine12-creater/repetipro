# ==== Configuration commune (dev et prod) ====
spring.application.name=repetipro
# Render fournit le port dans la variable PORT ; 8080 en local.
server.port=${PORT:8080}
# Profil par défaut : dev (H2). En production, définir SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Langue française pour les dates (#temporals) et messages
spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

# JPA : Hibernate crée/met à jour les tables automatiquement (simple pour débuter).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Formulaires : longueur max raisonnable
server.servlet.session.timeout=30d

# Numéros administrateurs (séparés par des virgules) : accès à /admin pour activer Solo.
repetipro.admin-telephones=${ADMIN_TELEPHONES:}
# Numéro RépétiPro sur lequel les répétiteurs paient l'abonnement Solo (affiché sur /formule).
repetipro.paiement.momo-numero=${PAIEMENT_MOMO_NUMERO:01 XX XX XX XX}
repetipro.paiement.momo-nom=${PAIEMENT_MOMO_NOM:REPETIPRO}

# ==== Paiement en ligne de Solo (FedaPay) : tout vient des variables d'environnement ====
# Sans FEDAPAY_SECRET_KEY, seul le transfert Mobile Money manuel ci-dessus est proposé.
repetipro.fedapay.secret-key=${FEDAPAY_SECRET_KEY:}
repetipro.fedapay.webhook-secret=${FEDAPAY_WEBHOOK_SECRET:}
# sandbox (test, par défaut) ou live (argent réel)
repetipro.fedapay.env=${FEDAPAY_ENV:sandbox}
# Adresse publique du site (lien de retour après paiement). Vide = déduite de la requête.
repetipro.app-base-url=${APP_BASE_URL:}
# Fausse caisse locale pour tester sans compte FedaPay (ignoré hors profil dev).
repetipro.paiement.simulation=${PAIEMENT_SIMULATION:false}
# Délais des appels à l'API FedaPay
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=20s
