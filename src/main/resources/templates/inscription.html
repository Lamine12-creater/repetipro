<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Créer un compte')}"></head>
<body>
  <header class="entete-site">
    <a th:replace="~{fragments :: logo(@{/})}"></a>
  </header>
  <main class="page-connexion apparait" id="contenu">
    <h1>Créer mon <span class="accent">compte</span></h1>
    <p class="petit">Gratuit jusqu'à 3 élèves, sans carte bancaire</p>

    <div class="carte">
      <!-- th:object lie le formulaire à InscriptionForm ; th:field remplit nom/valeur ; th:errors affiche les erreurs -->
      <form th:action="@{/inscription}" th:object="${form}" method="post">
        <label for="nom">Nom et prénom</label>
        <input id="nom" th:field="*{nomComplet}" placeholder="Ex. Rodrigue K." required>
        <p class="erreur-champ" th:if="${#fields.hasErrors('nomComplet')}" th:errors="*{nomComplet}"></p>

        <label for="tel">Numéro de téléphone</label>
        <input id="tel" th:field="*{telephone}" type="tel" placeholder="01 97 00 00 00" inputmode="tel" required>
        <p class="erreur-champ" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></p>

        <label for="mdp">Mot de passe (6 caractères minimum)</label>
        <input id="mdp" th:field="*{motDePasse}" type="password" required autocomplete="new-password">
        <p class="erreur-champ" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></p>

        <p style="margin-top:1rem"><button type="submit" class="btn bloc">Créer mon compte</button></p>
      </form>
    </div>
    <p class="petit" style="text-align:center;margin-top:.5rem">Déjà inscrit ? <a th:href="@{/connexion}">Se connecter</a></p>
  </main>
</body>
</html>
