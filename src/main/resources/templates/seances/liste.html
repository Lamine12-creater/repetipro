<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Séances')}"></head>
<body>
  <header th:replace="~{fragments :: barre}"></header>
  <main class="contenu apparait" id="contenu">
    <h1>Séances</h1>
    <div th:replace="~{fragments :: messages}"></div>

    <!-- Planifier une séance -->
    <form class="carte" th:action="@{/seances}" th:object="${form}" method="post">
      <h2>Planifier une séance</h2>
      <p th:if="${eleves.isEmpty()}" class="alerte info">Ajoutez d'abord un élève : <a th:href="@{/eleves/nouveau}">nouvel élève</a>.</p>
      <label for="eleve">Élève</label>
      <select id="eleve" th:field="*{eleveId}" required>
        <option value="">Choisir…</option>
        <option th:each="e : ${eleves}" th:value="${e.id}" th:text="${e.nom + ' (' + e.classe + ')'}">Élève</option>
      </select>
      <p class="erreur-champ" th:if="${#fields.hasErrors('eleveId')}" th:errors="*{eleveId}"></p>
      <div class="grille-2">
        <div>
          <label for="date">Date</label>
          <input id="date" type="date" th:field="*{date}" required>
          <p class="erreur-champ" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
        </div>
        <div>
          <label for="heure">Heure</label>
          <input id="heure" type="time" th:field="*{heure}" required>
          <p class="erreur-champ" th:if="${#fields.hasErrors('heure')}" th:errors="*{heure}"></p>
        </div>
      </div>
      <label for="duree">Durée</label>
      <select id="duree" th:field="*{dureeMinutes}">
        <option value="60">1 h</option><option value="90">1 h 30</option>
        <option value="120">2 h</option><option value="150">2 h 30</option><option value="180">3 h</option>
      </select>
      <p style="margin-top:1rem"><button type="submit" class="btn bloc" th:disabled="${eleves.isEmpty()}">Planifier</button></p>
    </form>

    <section class="carte">
      <h2>À venir (8 jours)</h2>
      <ul class="liste" th:unless="${aVenir.isEmpty()}">
        <li th:each="s : ${aVenir}">
          <span class="heure" th:text="${#temporals.format(s.debut, 'EEE d')}">mar. 20</span>
          <div class="infos">
            <strong th:text="${s.eleve.nom}">Élève</strong>
            <p class="petit" th:text="${#temporals.format(s.debut, 'HH''h''mm') + ' · ' + s.dureeLisible}">16h00 · 2 h</p>
          </div>
          <a th:href="@{/seances/{id}(id=${s.id})}" class="btn petit-btn"
             th:text="${s.presence.name() == 'NON_POINTEE' ? 'Pointer' : s.presence.libelle}">Pointer</a>
        </li>
      </ul>
      <p th:if="${aVenir.isEmpty()}" class="vide">Rien de prévu.</p>
    </section>

    <section class="carte">
      <h2>Récentes (14 jours)</h2>
      <ul class="liste" th:unless="${recentes.isEmpty()}">
        <li th:each="s : ${recentes}">
          <span class="heure" th:text="${#temporals.format(s.debut, 'EEE d')}">lun. 19</span>
          <div class="infos">
            <strong th:text="${s.eleve.nom}">Élève</strong>
            <p class="petit" th:text="${s.notions ?: 'Pas de notions notées'}">Notions</p>
          </div>
          <a th:href="@{/seances/{id}(id=${s.id})}" class="badge"
             th:classappend="${s.presence.name() == 'ABSENT' ? 'retard' : (s.presence.name() == 'NON_POINTEE' ? 'attente' : 'paye')}"
             th:text="${s.presence.libelle}">Présent</a>
        </li>
      </ul>
      <p th:if="${recentes.isEmpty()}" class="vide">Aucune séance passée.</p>
    </section>
  </main>
  <nav th:replace="~{fragments :: navBas('seances')}"></nav>
</body>
</html>
