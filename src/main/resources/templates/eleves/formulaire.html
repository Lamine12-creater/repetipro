<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${eleveId == null ? 'Nouvel élève' : 'Modifier l''élève'})}"></head>
<body>
  <header th:replace="~{fragments :: barre}"></header>
  <main class="contenu" id="contenu">
    <h1 th:text="${eleveId == null ? 'Nouvel élève' : 'Modifier l''élève'}">Nouvel élève</h1>
    <!-- Même formulaire pour créer (POST /eleves) et modifier (POST /eleves/{id}) -->
    <form class="carte" method="post" th:object="${form}"
          th:action="${eleveId == null} ? @{/eleves} : @{/eleves/{id}(id=${eleveId})}">
      <label for="nom">Nom de l'élève</label>
      <input id="nom" th:field="*{nom}" placeholder="Ex. Fifamè Exemple" required>
      <p class="erreur-champ" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>

      <div class="grille-2">
        <div>
          <label for="classe">Classe</label>
          <select id="classe" th:field="*{classe}" required
                  th:attr="data-classe-depart=${classeActuelle}">
            <option value="">Choisir la classe</option>
            <option th:each="c : ${classes}"
                    th:value="${c.libelle}"
                    th:attr="data-montant=${grille[c.libelle]}"
                    th:text="${c.libelle}">3ème</option>
            <!-- Ancienne saisie libre, conservée jusqu'au choix d'une classe officielle -->
            <option th:if="${classeLibre}"
                    th:value="${classeActuelle}"
                    th:attr="data-montant=${tarifActuel}"
                    th:text="${classeActuelle}">Autre</option>
          </select>
          <p class="erreur-champ" th:if="${#fields.hasErrors('classe')}" th:errors="*{classe}"></p>
        </div>
        <div>
          <label>Montant mensuel</label>
          <p id="montant-affiche" class="montant-fixe vide"
             th:attr="data-tarif-actuel=${tarifActuel}">—</p>
          <p id="montant-note" class="petit">Fixé par votre <a href="/tarifs">grille de tarifs</a>. Ce n'est pas négocié avec les parents.</p>
        </div>
      </div>

      <label for="matieres">Matières</label>
      <input id="matieres" th:field="*{matieres}" placeholder="Maths, PCT">
      <p class="erreur-champ" th:if="${#fields.hasErrors('matieres')}" th:errors="*{matieres}"></p>

      <label for="parent">Nom du parent</label>
      <input id="parent" th:field="*{nomParent}" placeholder="Mme Exemple">
      <p class="erreur-champ" th:if="${#fields.hasErrors('nomParent')}" th:errors="*{nomParent}"></p>

      <label for="wa">WhatsApp du parent</label>
      <input id="wa" th:field="*{whatsappParent}" type="tel" inputmode="tel" placeholder="01 97 00 00 00">
      <p class="petit">Numéro béninois à 10 chiffres ; +229 est ajouté automatiquement.</p>
      <p class="erreur-champ" th:if="${#fields.hasErrors('whatsappParent')}" th:errors="*{whatsappParent}"></p>

      <p style="margin-top:1rem"><button type="submit" class="btn bloc">Enregistrer</button></p>
      <a th:href="@{/eleves}" class="btn bloc secondaire">Annuler</a>
    </form>
  </main>
  <nav th:replace="~{fragments :: navBas('eleves')}"></nav>
  <script>
    (function () {
      var sel = document.getElementById('classe');
      var aff = document.getElementById('montant-affiche');
      if (!sel || !aff) return;
      var actuel = parseInt(aff.getAttribute('data-tarif-actuel') || '', 10);
      var depart = sel.getAttribute('data-classe-depart') || '';
      function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + ' FCFA'; }
      function maj() {
        var opt = sel.options[sel.selectedIndex];
        var m = opt && opt.getAttribute('data-montant');
        var note = document.getElementById('montant-note');
        if (!m) {
          aff.textContent = 'Choisissez une classe';
          aff.classList.add('vide');
          return;
        }
        aff.classList.remove('vide');
        var montant = parseInt(m, 10);
        var meme = depart && sel.value === depart;
        var defaut = 'Fixé par votre grille de tarifs. Ce n\'est pas négocié avec les parents.';
        if (meme && actuel && actuel !== montant) {
          aff.textContent = fmt(actuel);
          if (note) note.innerHTML = 'Ancien tarif conservé. Il passera à ' + fmt(montant) + ' si vous changez de classe.';
        } else {
          aff.textContent = fmt(montant);
          if (note) note.innerHTML = defaut + ' <a href="/tarifs">Modifier les tarifs</a>.';
        }
      }
      sel.addEventListener('change', maj);
      maj();
    })();
  </script>
</body>
</html>
